# Development Profile using In-Memory H2 with PostgreSQL compatibility
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:mysterybox_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# H2 Console (available at http://localhost:8080/h2-console when dev profile is active)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=${JWT_SECRET:MysteryBoxSuperSecretKeyForJwtSigning1234567890!@#$}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.admin.default-email=admin@mysterybox.com
app.admin.default-password=Admin@123
