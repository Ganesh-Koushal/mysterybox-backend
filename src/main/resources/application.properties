# MysteryBox Base Configuration

# Active Profile: Defaults to 'dev' (In-Memory H2) for effortless local demo.
# In production (Render/Supabase), set SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Port
server.port=${PORT:8080}

# Application Security & JWT Defaults
app.jwt.secret=${JWT_SECRET:MysteryBoxSuperSecretKeyForJwtSigning1234567890!@#$}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Administrator Defaults
app.admin.default-email=${ADMIN_DEFAULT_EMAIL:admin@mysterybox.com}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD:Admin@123}
