# Test configuration using in-memory H2
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

app.jwt.secret=MysteryBoxTestSuperSecretKeyForJwtSigning1234567890!@#$
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=*
app.admin.default-email=admin@mysterybox.com
app.admin.default-password=Admin@123
